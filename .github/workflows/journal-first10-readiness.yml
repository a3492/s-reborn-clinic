name: Journal First 10 Readiness Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/content/blog/doctor-column/**'
      - 'src/content.config.ts'
      - 'src/layouts/BlogPost.astro'
      - 'scripts/audit-journal-first10.mjs'
      - '.github/workflows/journal-first10-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Read-only release readiness audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Audit first 10 Journal articles
        run: node scripts/audit-journal-first10.mjs --out /tmp/journal-first10-readiness.json

      - name: Upload readiness report
        uses: actions/upload-artifact@v4
        with:
          name: journal-first10-readiness
          path: /tmp/journal-first10-readiness.json
          if-no-files-found: error
