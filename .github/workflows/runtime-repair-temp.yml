name: Temporary Cloudflare Runtime Repair

on:
  pull_request:
    branches: [main]

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set non-secret production runtime values
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL_VALUE: https://dprwrvmzuhukcyrjqstu.supabase.co
          GITHUB_REPO_VALUE: a3492/s-reborn-clinic
        run: |
          set -euo pipefail
          printf '%s' "$SUPABASE_URL_VALUE" | npx wrangler pages secret put SUPABASE_URL --project-name=s-reborn-clinic
          printf '%s' "$GITHUB_REPO_VALUE" | npx wrangler pages secret put GITHUB_REPO --project-name=s-reborn-clinic
          echo "Cloudflare runtime values updated: SUPABASE_URL and GITHUB_REPO (values not printed)."
