name: Pull Request Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Astro build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify publisher contract
        run: npm run check:publish-contract

      - name: Build
        run: npm run build

      - name: Temporary read-only production smoke
        shell: bash
        run: |
          set -euo pipefail
          base='https://s-reborn-clinic.pages.dev'
          for path in '/' '/blog/'; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 2 --max-time 20 "${base}${path}")"
            echo "${path} HTTP=${code}"
            test "${code}" = '200'
          done
          body="$(mktemp)"
          code="$(curl -sS -o "${body}" -w '%{http_code}' --retry 3 --retry-delay 2 --max-time 20 "${base}/api/admin/publish-health")"
          echo "publish-health HTTP=${code}"
          jq -r '.checks[]? | if .key == "env" then ("env=" + .status + " " + .detail) else (.key + "=" + .status) end' "${body}"
