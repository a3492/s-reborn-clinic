name: Pull Request Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Astro build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify publisher contract
        run: npm run check:publish-contract

      - name: Verify interaction event client contract
        run: npm run check:interaction-contract

      - name: Verify IR-301 migration security contract
        run: npm run check:ir301-migration

      - name: Verify Experience contract
        run: npm run check:experience-contract

      - name: Run read-only Experience inventory audit
        run: npm run audit:experience-readiness -- --out /tmp/experience-readiness.json

      - name: Build
        run: npm run build

      - name: Temporary read-only production env presence audit
        shell: bash
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL || secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY || secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY || secrets.PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          set -euo pipefail
          for name in PUBLIC_SUPABASE_URL PUBLIC_SUPABASE_ANON_KEY PUBLIC_TURNSTILE_SITE_KEY; do
            if [ -n "${!name}" ]; then
              echo "${name}=PRESENT"
            else
              echo "${name}=MISSING"
            fi
          done

          body="$(mktemp)"
          code="$(curl -sS -o "${body}" -w '%{http_code}' --retry 3 --retry-delay 2 --max-time 20 https://s-reborn-clinic.pages.dev/api/admin/publish-health)"
          echo "publish-health HTTP=${code}"
          jq -r '.checks[]? | select(.key == "env") | "runtime_env=" + .status + " " + (.detail // "")' "${body}"
