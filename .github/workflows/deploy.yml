name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate critical public build environment
        shell: bash
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          missing=0
          for name in PUBLIC_SUPABASE_URL PUBLIC_SUPABASE_ANON_KEY PUBLIC_TURNSTILE_SITE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Required GitHub Actions secret ${name} is missing or empty. Production Astro bundles would silently disable or break visitor interactions."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Build
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.PUBLIC_GA_MEASUREMENT_ID }}
          PUBLIC_CF_ANALYTICS_TOKEN: ${{ secrets.PUBLIC_CF_ANALYTICS_TOKEN }}
          PUBLIC_R2_MEDIA_URL: ${{ secrets.PUBLIC_R2_MEDIA_URL }}
          PUBLIC_SITE_URL: https://s-reborn-clinic.pages.dev

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist/client --project-name=s-reborn-clinic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke check deployed site
        shell: bash
        env:
          PUBLIC_SITE_URL: https://s-reborn-clinic.pages.dev
        run: |
          set -euo pipefail
          site="${PUBLIC_SITE_URL%/}"

          for path in / /blog/; do
            echo "Smoke checking ${path}"
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 5 \
              --max-time 30 \
              "${site}${path}" \
              >/dev/null
          done

          health_file="$(mktemp)"
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --max-time 30 \
            "${site}/api/admin/publish-health" \
            --output "${health_file}"

          HEALTH_FILE="${health_file}" node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync(process.env.HEALTH_FILE, 'utf8'));
          const checks = Array.isArray(data.checks) ? data.checks : [];
          for (const check of checks) {
            console.log(`${check.key}: ${check.status}`);
          }
          if (!data.ok) {
            console.error('::error::Deployed publish-health endpoint reported one or more errors.');
            process.exit(1);
          }
          NODE
