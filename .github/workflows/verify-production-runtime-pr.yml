name: Temporary Production Runtime Audit

on:
  pull_request:
    branches: [main]

jobs:
  runtime-audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Probe current production without secrets
        shell: bash
        env:
          PUBLIC_SITE_URL: https://s-reborn-clinic.pages.dev
        run: |
          set -euo pipefail
          site="${PUBLIC_SITE_URL%/}"

          for path in / /blog/; do
            code="$(curl --location --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' "${site}${path}")"
            echo "${path}: HTTP ${code}"
            if [ "${code}" -lt 200 ] || [ "${code}" -ge 400 ]; then
              echo "::error::Unexpected HTTP status for ${path}: ${code}"
              exit 1
            fi
          done

          health_file="$(mktemp)"
          health_code="$(curl --location --silent --show-error --max-time 30 --output "${health_file}" --write-out '%{http_code}' "${site}/api/admin/publish-health")"
          echo "/api/admin/publish-health: HTTP ${health_code}"

          HEALTH_FILE="${health_file}" HEALTH_CODE="${health_code}" node <<'NODE'
          const fs = require('fs');
          const code = Number(process.env.HEALTH_CODE || 0);
          let data;
          try {
            data = JSON.parse(fs.readFileSync(process.env.HEALTH_FILE, 'utf8'));
          } catch {
            console.error('::error::publish-health did not return valid JSON.');
            process.exit(1);
          }
          const checks = Array.isArray(data.checks) ? data.checks : [];
          for (const check of checks) {
            console.log(`${check.key}: ${check.status}`);
          }
          console.log(`publish_health_ok: ${Boolean(data.ok)}`);
          if (code < 200 || code >= 400 || !data.ok) process.exit(1);
          NODE
